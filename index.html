<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MS FASHION</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#1d2433;--mute:#667085;--gold:#d8b06e;--gold-deep:#b98a3c;--blue:#2d72b8;--beige:#e8ecf3;--line:#d9dee8;--shadow:rgba(23,28,35,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2029;--ink:#eef1f6;--mute:#9aa4b5;--beige:#232a36;--line:#323a48}} 
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2029;--ink:#eef1f6;--mute:#9aa4b5;--beige:#232a36;--line:#323a48}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Jost,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
.bar{background:var(--blue);color:#fff;text-align:center;font-size:13px;padding:7px 10px;letter-spacing:.04em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.w{max-width:1200px;margin:auto;padding:0 18px}
.top{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.logo{font-size:26px;letter-spacing:.14em;cursor:pointer}.logo b{color:var(--gold)}
.brand-logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;min-width:180px}
.brand-mark{position:relative;width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#f7e6c4,#d6b46d 38%,#9b7741 100%);box-shadow:0 8px 18px rgba(44,34,15,.16);display:grid;place-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.7)}
.brand-mark::before{content:"";position:absolute;inset:6px;border:2px solid rgba(255,255,255,.7);border-radius:10px}
.brand-mark span{position:relative;font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:700;letter-spacing:.08em;color:#1d2433;transform:translateY(-1px)}
.brand-text{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;line-height:1;color:#1d2433;letter-spacing:.12em;font-weight:600;text-transform:uppercase;white-space:nowrap}
.brand-text b{color:var(--gold-deep)}
.hero-brand{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px 20px;border-radius:999px;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);box-shadow:0 16px 28px rgba(41,62,90,.12);border:1px solid rgba(255,255,255,.28)}
.hero-brand .brand-mark{width:70px;height:70px;border-radius:18px}
.hero-brand .brand-mark span{font-size:30px}
.hero-brand .brand-text{font-size:42px;letter-spacing:.08em}
nav{display:flex;gap:18px;flex:1;flex-wrap:wrap}nav a{cursor:pointer;text-decoration:none;font-size:14px;letter-spacing:.05em;text-transform:uppercase;padding:2px 0;border-bottom:1px solid transparent;transition:.2s}nav a:hover{border-color:var(--gold);color:var(--gold)}
.tools{display:flex;gap:8px;align-items:center}
.tools input{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:20px;width:150px}
.ic{background:none;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;position:relative}
.ic i{position:absolute;top:-5px;right:-5px;background:var(--gold);color:#fff;font-style:normal;font-size:11px;border-radius:10px;padding:0 5px}
.btn{background:var(--blue);color:#fff;border:1px solid var(--blue);padding:11px 22px;letter-spacing:.06em;text-transform:uppercase;font-size:13px;transition:.2s}.btn:hover{background:var(--gold);border-color:var(--gold)}
.btn.o{background:none;color:var(--blue)}.btn:disabled{opacity:.45;cursor:not-allowed}
.hero{background:linear-gradient(120deg,#fde3ee,#e8ecf3 55%,var(--bg));padding:70px 0;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(40px,7vw,78px);line-height:1.05;margin:8px 0 16px}.hg{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center}@media(max-width:760px){.hg{grid-template-columns:1fr}}
.hero p{max-width:480px;color:var(--mute)}
section{padding:44px 0}h2{font-size:34px;margin-bottom:20px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.cat{background:var(--beige);padding:34px 10px;text-align:center;cursor:pointer;font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;border:1px solid var(--line);transition:.25s}.cat:hover{background:#eef1f6}
.pc{background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.25s;position:relative}.pc:hover{transform:translateY(-4px);box-shadow:0 10px 24px #0002}
.img{aspect-ratio:3/4;display:grid;place-items:center;font:600 60px "Cormorant Garamond",Georgia,serif;color:#ffffffcc;letter-spacing:.05em}
.pi{padding:12px}.pi h3{font-size:19px}.old{text-decoration:line-through;color:var(--mute);margin-left:6px;font-size:13px}
.tag{position:absolute;top:10px;left:10px;background:var(--gold);color:#fff;font-size:11px;padding:2px 8px;letter-spacing:.08em}
.heart{position:absolute;top:8px;right:8px;background:var(--card);border:0;border-radius:50%;width:32px;height:32px}
.band{background:#1d2a44;color:#fff;text-align:center;padding:40px 18px}.band h2{color:var(--gold);margin-bottom:6px}
.rv{background:var(--card);border:1px solid var(--line);padding:20px;font-style:italic}.rv b{display:block;font-style:normal;margin-top:8px;color:var(--gold)}
.shop{display:grid;grid-template-columns:200px 1fr;gap:26px}@media(max-width:760px){.shop{grid-template-columns:1fr}nav{order:3;flex-basis:100%}}
.fl label{display:block;margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}.fl select,.fl input{width:100%;padding:8px;background:var(--card);border:1px solid var(--line)}
.det{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media(max-width:760px){.det{grid-template-columns:1fr}}
.zoom{overflow:hidden;cursor:zoom-in}.zoom .img{transition:transform .3s;height:100%}.zoom:hover .img{transform:scale(1.5)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.chip{border:1px solid var(--line);background:var(--card);padding:6px 14px}.chip.on{background:var(--blue);color:#fff}
.note{border:1px solid var(--gold);background:var(--beige);padding:14px;margin:14px 0;font-size:14px}
input.f,textarea{width:100%;padding:10px;border:1px solid var(--line);background:var(--card);margin:4px 0 2px}.err{color:#c0392b;font-size:12px;min-height:16px;display:block}
.dr{position:fixed;inset:0 0 0 auto;width:min(380px,100%);background:var(--card);z-index:9;padding:20px;transform:translateX(100%);transition:.3s;overflow:auto;border-left:1px solid var(--line)}.dr.on{transform:translateX(0)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
footer{background:#1d2a44;color:#d5dbe8;padding:40px 0;font-size:14px}footer a{cursor:pointer;display:block;color:#d5dbe8}footer .grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
#v{animation:fi .4s}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
</style></head><body>
<div class="bar">Free delivery over ₨ 5,000 · Eid Collection up to 30% OFF</div>
<header><div class="w top"><div class="brand-logo lg" role="button" tabindex="0" aria-label="MS FASHION" onclick="go('home')"></div>
<nav id="nav"></nav>
<div class="tools"><input id="q" placeholder="Search…" aria-label="Search" onkeydown="if(event.key=='Enter'){S.q=this.value;go('shop')}">
<button class="ic" title="Account" onclick="go('info','Account')">👤</button>
<button class="ic" title="Wishlist" onclick="go('shop');S.wish=1;draw()">♡<i id="wc">0</i></button>
<button class="ic" title="Cart" onclick="cart(1)">🛍<i id="cc">0</i></button></div></div></header>
<main id="v"></main>
<aside class="dr" id="dr" aria-label="Cart"></aside>
<footer><div class="w grid"><div><div class="logo" style="color:#fff">MS<b>·</b>FASHION</div><p>Contact: [your phone] · [your email]<br>Instagram · Facebook · TikTok (add links)</p></div>
<div><b>Help</b><a onclick="go('info','Order Tracking')">Order Tracking</a><a onclick="go('info','FAQs')">FAQs</a><a onclick="go('info','Contact Us')">Contact Us</a></div>
<div><b>Policies</b><a onclick="go('info','Shipping Policy')">Shipping</a><a onclick="go('info','Return and Exchange Policy')">Returns &amp; Exchange</a><a onclick="go('info','Privacy Policy')">Privacy Policy</a></div>
<div><b>Store</b><a onclick="go('info','About Us')">About Us</a><a onclick="go('info','Admin')">Admin</a></div></div></footer>
<script>
function renderBrandLogo(target){
  const el=document.querySelector(target);
  if(!el) return;
  el.innerHTML = '<div class="brand-mark"><span>MS</span></div><div class="brand-text">MS <b>FASHION</b></div>';
}
const LOGO="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJ/2wBDAw0ODhESExITFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFhUVFx8WGQ==";
const g=x=>x.id%2?"linear-gradient(145deg,#f7b2d0,#e0709f)":"linear-gradient(145deg,#6aa2d8,#2d72b8)";
const BRAND="MS FASHION",BACKEND=null,FREE=5000,SHIP=250;
const P=[
{id:1,n:"Embroidered Lawn 3-Piece",c:"Unstitched",p:9500,d:7900,h:35,f:"Premium lawn",col:["Sage","Rose","Ivory"],t:"Summer",nw:1},
{id:2,n:"Chiffon Wedding Formal",c:"Women",p:32000,h:340,f:"Chiffon, hand embroidery",col:["Maroon","Emerald"],t:"Wedding",best:1},
{id:3,n:"Pret Kurta Set",c:"Ready-to-Wear",p:6800,d:5400,h:20,f:"Cotton silk",col:["Beige","Black"],t:"Eid",best:1},
{id:4,n:"Cotton Shalwar Kameez",c:"Men",p:7200,h:210,f:"Wash & wear",col:["White","Grey","Navy"],t:"Eid",nw:1,best:1},
{id:5,n:"Wool Waistcoat",c:"Men",p:11500,d:9200,h:30,f:"Wool blend",col:["Charcoal","Brown"],t:"Winter"},
{id:6,n:"Kids Embroidered Kurta",c:"Kids",p:3900,h:50,f:"Cotton",col:["Mint","Cream"],t:"Eid",nw:1},
{id:7,n:"Khaddar Winter Suit",c:"Unstitched",p:8400,d:6900,h:15,f:"Khaddar",col:["Mustard","Plum"],t:"Winter",best:1},
{id:8,n:"Pashmina Shawl",c:"Accessories",p:5600,h:45,f:"Pashmina",col:["Camel","Black"],t:"Winter"},
{id:9,n:"Kids Party Frock",c:"Kids",p:4800,d:3800,h:320,f:"Organza",col:["Pink","Lilac"],t:"Eid"},
{id:10,n:"Luxury Net Gown",c:"Women",p:45000,h:28,f:"Net, zari",col:["Gold","Ivory"],t:"Wedding",nw:1},
{id:11,n:"Embroidered Khussa",c:"Accessories",p:3200,h:38,f:"Leather",col:["Gold","Black"],t:"Wedding"},
{id:12,n:"Linen Ready-to-Wear Co-ord",c:"Ready-to-Wear",p:7900,h:160,f:"Linen",col:["Sand","Olive"],t:"Ramadan",best:1}];
const CATS=["Men","Women","Kids","Unstitched","Ready-to-Wear","Accessories"],SZ=["XS","S","M","L","XL","XXL"];
const R=n=>"₨ "+n.toLocaleString("en-PK"),pr=x=>x.d||x.p;
let S={cat:"",q:"",sort:"",size:"",max:"",wish:0,tag:""},cartL=[],wish=[],sel={};
try{cartL=JSON.parse(localStorage.getItem("msc")||"[]");wish=JSON.parse(localStorage.getItem("msw")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("msc",JSON.stringify(cartL));localStorage.setItem("msw",JSON.stringify(wish))}catch(e){}
cc.textContent=cartL.reduce((a,i)=>a+i.q,0);wc.textContent=wish.length};
const $=id=>document.getElementById(id);
$("nav").innerHTML=["New Arrivals","Men","Women","Kids","Sale"].map(x=>`<a onclick="nav('${x}')">${x}</a>`).join("")+`<a onclick="nav('')">Shop All</a>`;
function nav(x){S={cat:"",q:"",sort:"",size:"",max:"",wish:0,tag:""};if(x=="New Arrivals")S.sort="new";else if(x=="Sale")S.sort="sale";else S.cat=x;go("shop")}
function card(x){const on=wish.includes(x.id);return`<div class="pc" onclick="go('prod',${x.id})"><div class="img" style="background:${g(x)}">MS</div>
${x.d?`<span class="tag">-${Math.round(100-x.d/x.p*100)}%</span>`:x.nw?`<span class="tag">NEW</span>`:""}
<button class="heart" aria-label="Wishlist" onclick="event.stopPropagation();tw(${x.id})">${on?"♥":"♡"}</button>
<div class="pi"><h3>${x.n}</h3><span>${R(pr(x))}</span>${x.d?`<span class="old">${R(x.p)}</span>`:""}</div></div>`}
function tw(id){wish=wish.includes(id)?wish.filter(i=>i!=id):[...wish,id];save();draw()}
function go(v,a){window.scrollTo(0,0);cur=[v,a];draw()}let cur=["home"];
function draw(){const[v,a]=cur,m=$("v");save();m.style.animation="none";m.offsetHeight;m.style.animation="";
if(v=="home")m.innerHTML=home();else if(v=="shop")m.innerHTML=shop();else if(v=="prod")m.innerHTML=prod(a);
else if(v=="checkout")m.innerHTML=checkout();else m.innerHTML=info(a)
renderBrandLogo('.lg');
const heroBrand=document.querySelector('.hero-brand'); if(heroBrand) renderBrandLogo('.hero-brand');}
function home(){return`<div class="hero"><div class="w hg"><div><small>Eid · Wedding · Winter</small><h1>Discover Your Style</h1><p>Lawn, luxury formals and everyday ready-to-wear, made for Pakistan.</p><button class="btn" onclick="nav('Shop All')">Shop Now</button></div><div class="hero-brand" aria-label="MS FASHION"></div></div></div>
<section class="w"><h2>Shop by Category</h2><div class="grid">${CATS.map(c=>`<div class="cat" onclick="nav('${c}')">${c}</div>`).join("")}</div></section>
<section class="w"><h2>New Arrivals</h2><div class="grid">${P.filter(x=>x.nw).map(card).join("")}</div></section>
<div class="band"><h2>Season Sale</h2><p>Up to 30% off selected lawn, khaddar and kids' wear.</p><button class="btn o" style="color:#fff;border-color:#fff" onclick="nav('Sale')">View Sale</button></div>
<section class="w"><h2>Best Sellers</h2><div class="grid">${P.filter(x=>x.best).map(card).join("")}</div></section>
<section class="w"><h2>Seasonal Collections</h2><div class="grid">${["Eid","Ramadan","Wedding","Winter"].map(t=>`<div class="cat" onclick="S={cat:'',q:'',sort:'',size:'',max:'',wish:0,tag:'${t}'};go('shop')">${t}</div>`).join("")}</div></section>
<section class="w"><h2>Customer Reviews</h2><div class="grid"><div class="rv">★★★★★ "Sample review text. Replace with real customer reviews."<b>Customer name, City</b></div><div class="rv">★★★★★ "Beautiful fit and premium fabric. Highly recommended."<b>Aliya, Lahore</b></div><div class="rv">★★★★★ "Loved the Eid collection — easy ordering and quick delivery."<b>Zain, Karachi</b></div></div></section>
<section class="w" style="text-align:center"><h2>Newsletter</h2><input class="f" id="nl" style="max-width:340px" placeholder="Your email"><br><button class="btn" onclick="nlf()">Subscribe</button><span class="err" id="nle"></span></section>`}
function nlf(){const e=$("nl").value;$("nle").textContent=/^\S+@\S+\.\S+$/.test(e)?"Subscription needs a connected email service. Nothing was saved.":"Enter a valid email."}
function shop(){let l=P.filter(x=>(!S.cat||x.c==S.cat)&&(!S.tag||x.t==S.tag)&&(!S.q||(x.n+x.c).toLowerCase().includes(S.q.toLowerCase()))&&(!S.max||pr(x)<=+S.max)&&(!S.wish||wish.includes(x.id))&&(!S.size||x.c=="Accessories"||x.c=="Unstitched"||x.c=="Ready-to-Wear"));
if(S.sort=="new")l=l.filter(x=>x.nw);if(S.sort=="sale")l=l.filter(x=>x.d);if(S.sort=="lo")l.sort((a,b)=>pr(a)-pr(b));if(S.sort=="hi")l.sort((a,b)=>pr(b)-pr(a));
return`<section class="w"><h2>${S.wish?"Wishlist":S.cat||S.tag&&S.tag+" Collection"||S.sort=="sale"&&"Sale"||S.sort=="new"&&"New Arrivals"||"Shop All"}</h2>
<div class="shop"><div class="fl"><label>Category</label><select onchange="S.cat=this.value;draw()"><option value="">All</option>${CATS.map(c=>`<option ${S.cat==c?"selected":""}>${c}</option>`).join("")}</select>
<label>Max price</label><select onchange="S.max=this.value;draw()">${[["","Any"],[5000,"₨ 5,000"],[10000,"₨ 10,000"],[30000,"₨ 30,000"]].map(o=>`<option value="${o[0]}" ${S.max==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select>
<label>Sort</label><select onchange="S.sort=this.value;draw()"><option value="">Featured</option><option value="lo" ${S.sort=="lo"?"selected":""}>Price: low to high</option><option value="hi" ${S.sort=="hi"?"selected":""}>Price: high to low</option><option value="new" ${S.sort=="new"?"selected":""}>New arrivals</option><option value="sale" ${S.sort=="sale"?"selected":""}>Sale</option></select>
<button class="btn o" style="margin-top:14px;width:100%" onclick="nav('')">Reset</button></div>
<div class="grid">${l.map(card).join("")||"<p>No products match.</p>"}</div></div></section>`}
function prod(id){const x=P.find(p=>p.id==id),s=sel[id]=sel[id]||{z:"",c:x.col[0],q:1},sizes=x.c=="Unstitched"?["Free"]:x.c=="Accessories"?["One size"]:SZ;
return`<section class="w"><a style="cursor:pointer" onclick="go('shop')">← Back to shop</a><br><br><div class="det"><div class="zoom"><div class="img" style="background:${g(x)}">MS</div></div>
<div><h2 style="text-align:left">${x.n}</h2><p style="font-size:20px">${R(pr(x))}${x.d?`<span class="old">${R(x.p)}</span>`:""}</p><p style="color:var(--mute)">Fabric: ${x.f}</p>
<b>Size</b><div class="chips">${sizes.map(z=>`<button class="chip ${s.z==z?"on":""}" onclick="sel[${id}].z='${z}';draw()">${z}</button>`).join("")}</div>
<b>Colour</b><div class="chips">${x.col.map(z=>`<button class="chip ${s.c==z?"on":""}" onclick="sel[${id}].c='${z}';draw()">${z}</button>`).join("")}</div>
<b>Qty</b> <input type="number" min="1" max="10" value="${s.q}" style="width:64px;padding:6px" onchange="sel[${id}].q=Math.max(1,Math.min(10,+this.value||1))"> <span class="err" id="pe"></span>
<p><button class="btn" onclick="add(${id},0)">Add to Cart</button> <button class="btn o" onclick="add(${id},1)">Buy Now</button></p>
<div class="note"><b>Stock:</b> live inventory needs the backend. Size guide, delivery and reviews appear here once connected.</div>
<p style="color:var(--mute)">Delivery: ${R(SHIP)} nationwide, free over ${R(FREE)}. Estimated dates are shown at checkout once shipping rules are configured.</p></div></div></section>
<section class="w"><h2>You May Also Like</h2><div class="grid">${P.filter(p=>p.c==x.c&&p.id!=id||p.t==x.t&&p.id!=id).slice(0,4).map(card).join("")}</div></section>`}
function add(id,buy){const s=sel[id],x=P.find(p=>p.id==id);if(!s.z){$("pe").textContent="Choose a size";return}
const k=id+s.z+s.c,i=cartL.find(c=>c.k==k);i?i.q+=s.q:cartL.push({k,id,z:s.z,c:s.c,q:s.q});save();buy?go("checkout"):cart(1)}
function cart(o){const d=$("dr");d.classList.toggle("on",!!o);if(!o)return;const sub=cartL.reduce((a,i)=>a+pr(P.find(p=>p.id==i.id))*i.q,0);
d.innerHTML=`<div class="row"><h3>Your Cart</h3><button class="ic" onclick="cart(0)">✕</button></div>`+(cartL.map((i,n)=>{const x=P.find(p=>p.id==i.id);return`<div class="row"><div>${x.n}<br><small>${i.z} · ${i.c}</small></div><div><b>${R(pr(x)*i.q)}</b><br><small><button class="ic" onclick="q(${n},-1)">−</button> ${i.q} <button class="ic" onclick="q(${n},1)">+</button></small></div></div>`}).join("")||"<p>Your cart is empty.</p>")+`<div class="row"><b>Subtotal</b><b>${R(sub)}</b></div><p style="color:var(--mute);font-size:13px">Coupons are checked at checkout once a backend is connected.</p><button class="btn" style="width:100%" onclick="go('checkout')">Checkout</button>`}
function q(n,d){cartL[n].q+=d;if(cartL[n].q<1)cartL.splice(n,1);save();cart(1)}
function checkout(){const sub=cartL.reduce((a,i)=>a+pr(P.find(p=>p.id==i.id))*i.q,0),sh=sub>=FREE||!sub?0:SHIP;
const F=(id,l,t="text")=>`<label>${l}<input class="f" id="${id}" type="${t}"><span class="err" id="e_${id}"></span></label>`;
return`<section class="w"><h2>Checkout</h2><div class="det"><div>${F("nm","Full name")}${F("ph","Mobile (03XX-XXXXXXX)","tel")}${F("em","Email","email")}${F("ad","Street address")}${F("ar","Area")}${F("ct","City")}${F("pc","Postal code","number")}</div>
<div><b>Order total</b><div class="row"><span>Subtotal</span>${R(sub)}</div><div class="row"><span>Delivery</span>${sh?R(sh):"Free"}</div><div class="row"><b>Total</b><b>${R(sub+sh)}</b></div>
<div class="note"><b>Payments: none configured.</b><br>COD · Bank transfer · Easypaisa · JazzCash · Cards: not available until each is set up with its merchant account and the backend. They are not connected to a live checkout yet.</div>
<button class="btn" style="width:100%" onclick="place()">Place Order</button><span class="err" id="pl"></span></div></div></section>`}
function place(){const v={nm:/\S{2}/,ph:/^(\+92|0)3\d{2}-?\d{7}$/,em:/^\S+@\S+\.\S+$/,ad:/\S{4}/,ar:/\S{2}/,ct:/\S{2}/,pc:/^\d{5}$/};let ok=1;
for(const k in v){const g=v[k].test($(k).value.trim());$("e_"+k).textContent=g?"":"Please check this field";if(!g)ok=0}
$("pl").textContent=ok?(cartL.length?"Order NOT placed: no backend or payment method is connected yet." : "Your cart is empty."):""}
const INFO={"About Us":"Write your brand story here.","Contact Us":"Add your phone, email, address and a contact form (form needs email service).","FAQs":"Add your questions and answers here.","Shipping Policy":"Explain delivery times, charges and regions.","Return and Exchange Policy":"List return windows and conditions.","Privacy Policy":"Explain what data is collected and how it is used.","Account":"Registration and login need a backend with secure authentication.","Order Tracking":"Tracking needs the orders database. Not connected.","Admin":"Admin dashboard (products, inventory, orders) needs a backend and secure login."};
function info(t){return`<section class="w" style="max-width:760px"><h2>${t}</h2><p>${INFO[t]||""}</p><div class="note">Still to configure for a live store: database (products, users, orders, stock), payments, shipping rules, real reviews and email setup.</div></section>`}
renderBrandLogo('.lg');
draw();
</script></body></html>
